name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'fanbox-downloader.ts'
      - 'package.json'
      - 'bun.lock'
      - 'docs/**'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install
      - run: bunx biome check .
      - run: bun run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
