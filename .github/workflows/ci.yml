name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# 同じ PR に続けて push したとき、古い実行を捨てて最新だけ走らせる
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install
      - run: bunx biome check .
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
